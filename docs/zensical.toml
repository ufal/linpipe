    { "Coreference Resolution" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
    { "Semantic Analysis" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
  ] },
  { "Training" = [
    "training/training.md",
    { "Tokenization" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
    { "Morphosyntactic Analysis" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
    { "Named Entity Recognition" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
    { "Privacy Filtering" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
    { "Coreference Resolution" = [
      { "Model1" = "..." }, { "Model2" = "..." }, { "Model3" = "..." },
    ] },
