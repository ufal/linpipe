extra_css = [
  "https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css",
  "assets/extra.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js",
  "assets/katex_load.js",
]

[project.theme]
logo = "images/favicon.svg"
favicon = "images/favicon.svg"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.arithmatex.generic = true
pymdownx.arithmatex.inline_syntax = ["dollar"]
pymdownx.arithmatex.block_syntax = ["dollar"]
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify.kwds.case = "lower"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["pyi_api"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://pytorch.org/docs/stable/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_options = { ignore_init_summary = true }
docstring_section_style = "list"
members_order = "source"
merge_init_into_class = true
group_by_category = false
show_root_heading = true
show_symbol_type_toc = true
show_symbol_type_heading = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
line_length = 80
show_source = false

[project.plugins.markdown-exec]
