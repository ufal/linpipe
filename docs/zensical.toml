extra_css = [
  "assets/fonts/fonts.css",
  "assets/katex/katex.min.css",
  "assets/extra.css",
]
extra_javascript = [
  "assets/katex/katex.min.js",
  "assets/katex_load.js",
]

[project.theme]
logo = "images/favicon.svg"
favicon = "images/favicon.svg"
font = false
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.arithmatex.generic = true
pymdownx.arithmatex.inline_syntax = ["dollar"]
pymdownx.arithmatex.block_syntax = ["dollar"]
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify.kwds.case = "lower"

[project.plugins.markdown-exec]
